name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

  backend-contracts:
    name: API and websocket contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run focused contract tests
        run: ./mvnw -Dtest=AccessControlServiceTest,MessageServiceIdempotencyTest,RealtimeEventPublisherTest test

  migration-smoke:
    name: Flyway migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: messenger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messenger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Apply Flyway migrations
        run: >
          ./mvnw -q
          -Dflyway.url=jdbc:postgresql://localhost:5432/messenger
          -Dflyway.user=postgres
          -Dflyway.password=password
          -Dflyway.locations=filesystem:src/main/resources/db/migration
          org.flywaydb:flyway-maven-plugin:9.22.3:migrate

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate messengerctl syntax
        run: bash -n scripts/messengerctl.sh

  web-client:
    name: Web client tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run web client tests and build in Docker
        run: >
          docker run --rm
          -v "$PWD/web-client:/app"
          -w /app
          node:18-alpine
          sh -c "npm ci && npm run test:foundation && npm run test:mobile && npm run build"

      - name: Run mobile E2E in Playwright Docker
        run: >
          docker run --rm
          -v "$PWD/web-client:/app"
          -w /app
          mcr.microsoft.com/playwright:v1.49.1-jammy
          sh -c "npm ci && npm run test:e2e:mobile"

  desktop-client:
    name: Desktop client package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package desktop client
        run: mvn -q -DskipTests package
